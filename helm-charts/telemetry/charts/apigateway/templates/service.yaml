apiVersion: v1
kind: Service
metadata:
  name: {{ include "apigateway.fullname" . }}
  labels:
    app.kubernetes.io/name: apigateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apigateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: http