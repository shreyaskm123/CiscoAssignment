apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamer.fullname" . }}
  labels:
    app.kubernetes.io/name: streamer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: streamer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: streamer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MQ_ADDR
              value: {{ .Values.mqAddr | default (printf "%s-messagequeue-leader:50051" .Release.Name) | quote }}
            {{- if .Values.mqAuth.existingSecret }}
            # Re-read per RPC, so rotating the Secret needs no pod restart.
            - name: MQ_TOKEN_FILE
              value: /etc/telemetry/auth/token
            {{- end }}
            - name: CLUSTER
              value: {{ .Values.cluster | quote }}
            - name: CSV_PATH
              value: {{ .Values.csvPath | quote }}
            - name: REGISTRY_TTL_S
              value: {{ .Values.registry.ttlSeconds | quote }}
            - name: REGISTRY_POLL_INTERVAL_MS
              value: {{ .Values.registry.pollIntervalMs | quote }}
            - name: ROW_DELAY_MS
              value: {{ .Values.pipeline.rowDelayMs | quote }}
            - name: BATCH_SIZE
              value: {{ .Values.pipeline.batchSize | quote }}
            - name: FLUSH_INTERVAL_MS
              value: {{ .Values.pipeline.flushIntervalMs | quote }}
            - name: RELOAD_CHECK_INTERVAL_S
              value: {{ .Values.pipeline.reloadCheckIntervalSeconds | quote }}
            - name: SHUTDOWN_GRACE_MS
              value: {{ .Values.pipeline.shutdownGraceMs | quote }}
            - name: HEALTH_ADDR
              value: ":{{ .Values.health.port }}"
            - name: READY_MAX_STALL_SECONDS
              value: {{ .Values.health.readyMaxStallSeconds | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
          # See the collector chart for why these used to be /bin/true and why
          # liveness stays independent of the message queue: a streamer blocked
          # in Send while the queue withholds acks raises no error, so the stall
          # check on /readyz is the only thing that notices.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: metrics-csv
              mountPath: {{ dir .Values.csvPath }}
            {{- if .Values.mqAuth.existingSecret }}
            - name: auth-tokens
              mountPath: /etc/telemetry/auth
              readOnly: true
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: metrics-csv
          configMap:
            name: {{ .Values.csvConfigMap | default (printf "%s-streamer-metrics-csv" .Release.Name) }}
        {{- if .Values.mqAuth.existingSecret }}
        # Project only this service's own token: mounting the whole Secret would
        # also expose the collector's and follower's tokens to this pod.
        - name: auth-tokens
          secret:
            secretName: {{ .Values.mqAuth.existingSecret | quote }}
            items:
              - key: streamer
                path: token
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}