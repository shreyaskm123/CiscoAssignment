apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collector.fullname" . }}
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MQ_ADDR
              value: {{ .Values.mqAddr | default (printf "%s-messagequeue-leader:50051" .Release.Name) | quote }}
            {{- if .Values.mqAuth.existingSecret }}
            # Re-read per RPC, so rotating the Secret needs no pod restart.
            - name: MQ_TOKEN_FILE
              value: /etc/telemetry/auth/token
            {{- end }}
            - name: CONSUMER_ID
              value: {{ .Values.consumerId | quote }}
            - name: REGISTRY_TTL_S
              value: {{ .Values.registry.ttlSeconds | quote }}
            - name: REGISTRY_POLL_INTERVAL_MS
              value: {{ .Values.registry.pollIntervalMs | quote }}
            - name: CONSUME_POLL_INTERVAL_MS
              value: {{ .Values.consume.pollIntervalMs | quote }}
            - name: SINK
              value: {{ .Values.sink | quote }}
            - name: CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | default (printf "%s-clickhouse" .Release.Name) | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.db | quote }}
            - name: CLICKHOUSE_TABLE
              value: {{ .Values.clickhouse.table | quote }}
            - name: CLICKHOUSE_CLUSTER
              value: {{ .Values.clickhouse.cluster | quote }}
            # A scoped, non-admin user per service, read from a Secret. When
            # unset the chart falls back to the unauthenticated dev default.
            {{- if .Values.clickhouse.credentialsSecret }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.credentialsSecret | quote }}
                  key: user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.credentialsSecret | quote }}
                  key: password
            {{- else }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            {{- end }}
            - name: FLUSH_INTERVAL_MS
              value: {{ .Values.flushIntervalMs | quote }}
            - name: DEAD_LETTER_DIR
              value: {{ .Values.dlqPath | quote }}
            - name: HEALTH_ADDR
              value: ":{{ .Values.health.port }}"
            - name: READY_MAX_STALL_SECONDS
              value: {{ .Values.health.readyMaxStallSeconds | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
          # These used to be `exec: ["/bin/true"]`, which cannot fail: a
          # collector that had stopped making progress still reported 1/1
          # Running, and the pipeline once ran for hours at a fraction of its
          # rate with every pod looking healthy. /healthz is liveness and stays
          # dependency-free on purpose - if it reflected ClickHouse or the MQ,
          # a dependency outage would restart every pod at once. /readyz is
          # where "can this pod do its job" is answered.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: dlq
              mountPath: {{ dir .Values.dlqPath }}
            {{- if .Values.mqAuth.existingSecret }}
            - name: auth-tokens
              mountPath: /etc/telemetry/auth
              readOnly: true
            {{- end }}
      volumes:
        - name: dlq
          emptyDir: {}
        {{- if .Values.mqAuth.existingSecret }}
        # Project only this service's own token, not the whole Secret.
        - name: auth-tokens
          secret:
            secretName: {{ .Values.mqAuth.existingSecret | quote }}
            items:
              - key: collector
                path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}